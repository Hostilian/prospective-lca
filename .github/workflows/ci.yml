name: quality-and-pages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check formatting boundaries
        run: git diff --check

      - name: Compile application and tests
        run: python -m compileall -q app tests tools

      - name: Run offline test suite
        run: python -m unittest discover -s tests -v

      - name: Generate synthetic review package
        run: python -m app.cli demo --out /tmp/awam-demo

      - name: Build both self-contained report previews
        run: python tools/build_report_previews.py --package /tmp/awam-demo

      - name: Recalculate source and verify review-package fingerprints
        run: python tools/verify_review_package.py --package /tmp/awam-demo

      - name: Bundle review exports with source revision
        if: matrix.python-version == '3.12'
        run: python tools/package_review.py --package /tmp/awam-demo --source-ref '${{ github.sha }}' --out /tmp/technical-review-package.zip

      - name: Retain technical review package
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: technical-review-package
          path: |
            /tmp/technical-review-package.zip
            /tmp/technical-review-package.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify synthetic package has required artifacts
        run: |
          test -s /tmp/awam-demo/index.html
          test -s /tmp/awam-demo/run.json
          test -s /tmp/awam-demo/manifest.json
          test -s /tmp/awam-demo/results.csv
          test -s /tmp/awam-demo/customer/index.html
          test -s /tmp/awam-demo/reviewer/index.html
          test -s /tmp/awam-demo/preview-manifest.json
          test -s /tmp/awam-demo/review-diagnostics.json

      - name: Verify production approval gate remains fail-closed
        shell: bash
        run: |
          set +e
          python -m app.cli validate --mode production
          status=$?
          set -e
          test "$status" -eq 2

      - name: Reject licensed or confidential data patterns
        shell: bash
        run: |
          if find . -type f \( -name '*.zolca' -o -name '*.ecospold*' -o -name '*.spold' -o -name '*.sqlite' -o -name '*.db' \) -not -path './.git/*' | grep -q .; then
            echo 'Forbidden licensed/database artifact detected.'
            exit 1
          fi

  docker:
    name: Docker build and smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag awam-prospective-lca-workbench:${{ github.sha }} .

      - name: Start container
        run: docker run --detach --name awam-lca --publish 8765:8765 awam-prospective-lca-workbench:${{ github.sha }}

      - name: HTTP smoke test
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ | grep -q 'Synthetic demonstration'; then
              curl --fail --silent http://127.0.0.1:8765/reviewer/ | grep -q 'Credit exclusion'
              curl --fail --silent http://127.0.0.1:8765/customer/ | grep -q 'Study brief'
              curl --fail --silent http://127.0.0.1:8765/review-diagnostics.json | grep -q 'order_check'
              exit 0
            fi
            sleep 1
          done
          docker logs awam-lca
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force awam-lca || true

  pages:
    name: Deploy synthetic report to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate Pages artifact
        run: |
          python -m app.cli demo --out _site
          python tools/build_report_previews.py --package _site
          python tools/verify_review_package.py --package _site
          python tools/package_review.py --package _site --source-ref '${{ github.sha }}' --out _site/technical-review-package.zip

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
